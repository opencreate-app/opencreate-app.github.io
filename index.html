<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="/favicon_light.svg"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      href="/favicon_dark.svg"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="theme-color" content="#5555FF" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="preload"
      href="/fonts/roboto-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Basic SEO -->
    <title>OpenCreate</title>
    <meta
      name="description"
      content="A platform for modern, high-performance, open-source creative tools. Discover OpenCreate Forge, our professional image editor."
    />
    <meta
      name="keywords"
      content="OpenCreate, OpenCreate Forge, image editor, open-source, canvas engine, double-buffering, layers, design, raster, ocfd, OpenCreate Forge Document"
    />
    <meta name="author" content="OpenCreate" />
    <link rel="canonical" href="https://opencreate-app.github.io/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OpenCreate" />
    <meta property="og:url" content="https://opencreate-app.github.io/" />
    <meta property="og:title" content="OpenCreate" />
    <meta
      property="og:description"
      content="We develop high-performance professional applications for creators. 100% open-source, offline-first, and telemetry-free."
    />
    <meta
      property="og:image"
      content="https://opencreate-app.github.io/cover.webp"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://opencreate-app.github.io/" />
    <meta name="twitter:title" content="OpenCreate" />
    <meta
      name="twitter:description"
      content="We develop high-performance professional applications for creators. 100% open-source, offline-first, and telemetry-free."
    />
    <meta
      name="twitter:image"
      content="https://opencreate-app.github.io/cover.webp"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://opencreate-app.github.io/#organization",
            "name": "OpenCreate",
            "url": "https://opencreate-app.github.io/",
            "logo": "https://opencreate-app.github.io/OpenCreate-Logo.svg",
            "sameAs": ["https://github.com/opencreate-app"]
          },
          {
            "@type": "SoftwareApplication",
            "name": "OpenCreate Forge",
            "applicationCategory": "GraphicsApplication",
            "operatingSystem": "Windows, macOS, Linux",
            "url": "https://opencreate-app.github.io/forge/",
            "description": "A fast, private, open-source image editor for creators.",
            "publisher": {
              "@id": "https://opencreate-app.github.io/#organization"
            }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
